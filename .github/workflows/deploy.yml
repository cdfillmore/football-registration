name: Verify and deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply football_registration --remote
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Verify live fixture time
        run: |
          node --input-type=module <<'EOF'
          const response = await fetch('https://football-registration.cdfillmore.workers.dev/api/registration', { cache: 'no-store' });
          if (!response.ok) throw new Error(`Registration API returned ${response.status}`);
          const { fixture } = await response.json();
          console.log(`Upcoming fixture: ${fixture?.startsAt ?? 'none'}`);
          if (fixture) {
            const parts = new Intl.DateTimeFormat('en-GB', {
              timeZone: 'Europe/Vienna', weekday: 'short', hour: '2-digit', hourCycle: 'h23'
            }).formatToParts(new Date(fixture.startsAt));
            const get = type => parts.find(part => part.type === type)?.value;
            if (get('weekday') === 'Mon' && get('hour') !== '18') {
              throw new Error(`Monday fixture is scheduled for ${get('hour')}:00 Vienna time`);
            }
          }
          EOF
