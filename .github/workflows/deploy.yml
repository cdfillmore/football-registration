name: Deploy
on: { push: { branches: [main] } }
permissions: { contents: read, packages: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with: { push: true, tags: 'ghcr.io/${{ github.repository }}:${{ github.sha }}' }
      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: '${{ secrets.DEPLOY_HOST }}'
          username: '${{ secrets.DEPLOY_USER }}'
          key: '${{ secrets.DEPLOY_KEY }}'
          fingerprint: '${{ secrets.DEPLOY_FINGERPRINT }}'
          script: 'cd ${{ secrets.DEPLOY_PATH }} && sed -i "s|^IMAGE=.*|IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}|" .env && docker compose -f docker-compose.deploy.yml pull && docker compose -f docker-compose.deploy.yml up -d'
